---
# LCP unified server (REST + gRPC) Deployment.
#
# Single image, single process: ``lcp-server`` runs both the REST API
# (port 8080) and the gRPC server (port 50051) inside one asyncio event
# loop.  Stateless — safe to HPA-scale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcp-server
  namespace: lcp
  labels:
    app.kubernetes.io/name: lcp-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: lcp
spec:
  # 2 replicas: eliminates SPOF during node drain / rolling deploy.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lcp-server
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: lcp
      # Prometheus scrape annotations -- /metrics rides on the same
      # 8080/http port as the application API (see
      # src/lcp/api/rest/main.py); the OIDC middleware whitelists
      # /metrics so anonymous scrape works.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: lcp-server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: lcp:dev
          imagePullPolicy: IfNotPresent
          # Dockerfile CMD is already ``lcp-server --insecure``; override
          # args here when mTLS is ready (remove --insecure).
          envFrom:
            - configMapRef:
                name: lcp-config
            - secretRef:
                name: lcp-secrets
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          # Probes target the REST /healthz (liveness) and /readyz
          # (readiness, includes DB ping).  gRPC health is implicitly
          # covered — both run in the same process, so if the REST
          # surface is healthy the gRPC surface is too.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lcp-server
  namespace: lcp
  labels:
    app.kubernetes.io/name: lcp-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: lcp-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30808
    - name: grpc
      port: 50051
      targetPort: grpc
