---
# Lifecycle worker Deployment (includes embedded planner).
#
# Generic worker: claims any task type and runs an embedded planner loop
# (every 60s) that scans lifecycle policies and emits tasks.  The planner
# replaces the former standalone CronJob — one fewer manifest to manage.
#
# To disable the planner and run as a pure executor:
#   args: ["--disable-planner"]
#
# To specialise by task type (e.g. INDEX_OPTIMIZE only):
#   args: ["--task-type", "INDEX_OPTIMIZE", "--disable-planner"]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcp-worker
  namespace: lcp
  labels:
    app.kubernetes.io/name: lcp-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lcp
spec:
  # 2 replicas: if one worker pod is evicted or a node drains, the other
  # continues claiming tasks.  Workers are stateless at the Pod level --
  # task ownership is tracked in the DB with heartbeats.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lcp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lcp-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: lcp
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: lcp-worker
                topologyKey: kubernetes.io/hostname
      # Extended grace period: the worker's SIGTERM handler drains the
      # in-flight task tick (executor calls lance / MySQL) before exiting.
      # 120 s gives the executor a full cycle to reach SUCCEEDED or FAILED.
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: lcp:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "lcp.workers.lifecycle_worker"]
          args:
            - "--idle-seconds=2"
            - "--busy-seconds=0.1"
            - "--planner-seconds=60"
          envFrom:
            - configMapRef:
                name: lcp-config
            - secretRef:
                name: lcp-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
