---
# Lifecycle worker Deployment.
#
# Generic worker: claims any task type.  If you want specialised pools
# (e.g. INDEX_OPTIMIZE only), copy this manifest and pass
# ``--task-type INDEX_OPTIMIZE`` via args.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcp-worker
  namespace: lcp
  labels:
    app.kubernetes.io/name: lcp-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: lcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lcp-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lcp-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: lcp
      # Prometheus scrape annotations -- match the kube-prometheus
      # "kubernetes-pods" auto-discovery convention; ServiceMonitor
      # users (Operator) ignore these in favour of the labels above.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      # The worker exposes a 9464 metrics port (see ports: below) but
      # no application HTTP surface; terminationGracePeriod gives
      # SIGTERM enough time for the in-flight tick to drain to
      # SUCCEEDED / FAILED before the kubelet sends SIGKILL.  See
      # lifecycle_worker signal handler.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: lcp:dev
          imagePullPolicy: IfNotPresent
          # Override the image's default REST CMD with the worker
          # entry-point.  Args are passed through to argparse.
          command: ["python", "-m", "lcp.workers.lifecycle_worker"]
          args:
            - "--idle-seconds=2"
            - "--busy-seconds=0.1"
          envFrom:
            - configMapRef:
                name: lcp-config
            - secretRef:
                name: lcp-secrets
          ports:
            # Prometheus scrape port; the CLI starts a stand-alone
            # exporter via prometheus_client.start_http_server.
            - name: metrics
              containerPort: 9464
              protocol: TCP
          # No application probes: the worker is a polling daemon
          # with no application HTTP surface.  Liveness is observable
          # via the worker_registry table + kubectl logs.  We do not
          # probe the metrics port either -- prometheus_client's
          # background HTTP server is best-effort and we never want a
          # metrics-only failure to crash-loop the worker.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
