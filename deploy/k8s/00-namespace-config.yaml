---
# Namespace, secrets, configmap for the LCP control plane.
#
# Why a dedicated namespace:
# - keeps RBAC / network policies scoped to LCP
# - allows wholesale teardown via `kubectl delete ns lcp` without
#   touching neighbouring stacks (ray-system, daft-platform, fluss).
apiVersion: v1
kind: Namespace
metadata:
  name: lcp
  labels:
    app.kubernetes.io/part-of: lcp
---
# Connection settings the three workloads share.  ConfigMap (not Secret)
# because hostnames + bucket names are not sensitive.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lcp-config
  namespace: lcp
data:
  # Cluster-internal MySQL endpoint -- mysql-cdc Pod in the default ns.
  # Pydantic Settings env name = LCP_<UPPER(field_name)>; the field is
  # `db_dsn` in src/lcp/core/config.py, hence `LCP_DB_DSN`.
  LCP_DB_DSN: "mysql+aiomysql://lcp:lcp_dev_pwd@mysql-cdc.default.svc.cluster.local:3306/lcp"

  # REST: bind to all interfaces inside the Pod (default is loopback,
  # which would make the kubelet probe + Service unreachable).
  LCP_REST_HOST: "0.0.0.0"
  LCP_REST_PORT: "8080"

  # gRPC same.
  LCP_GRPC_HOST: "0.0.0.0"
  LCP_GRPC_PORT: "50051"

  # mTLS / OIDC: keep dev defaults, no real auth wired up here yet.
  LCP_MTLS_REQUIRE_CLIENT_CERT: "false"
  LCP_ENFORCE_TENANT_RLS: "false"
  LCP_APP_ENV: "dev-k8s"

  # Lance object-storage config -- consumed by
  # ``lcp.data_plane.lance_io.build_storage_options`` via
  # ``Settings.lance_storage_*`` fields (pydantic-settings derives env
  # names as ``LCP_<UPPER(field_name)>``).  Endpoint + region are not
  # secrets so they live in this ConfigMap; the access/secret keys
  # live in the ``lcp-secrets`` Secret below and are injected with the
  # matching ``LCP_LANCE_STORAGE_*`` names so the same Settings field
  # picks them up regardless of source.  Default empty endpoint =
  # local filesystem mode (no MinIO call); set to the cluster-internal
  # MinIO endpoint to enable the s3:// data path used by VECTORIZE
  # (slice 4 / B.6 beta.2a) and friends.
  LCP_LANCE_STORAGE_ENDPOINT: "http://minio.daft-platform.svc.cluster.local:9000"
  LCP_LANCE_STORAGE_REGION: "us-east-1"

  # Legacy aliases kept for descriptive ``kubectl describe cm``
  # output -- NOT consumed by code.  Slated for removal once any
  # external tooling that reads them is updated.
  LCP_STORAGE_ENDPOINT_URL: "http://minio.daft-platform.svc.cluster.local:9000"
  LCP_STORAGE_BUCKET: "lcp-lance"
  LCP_STORAGE_REGION: "us-east-1"

  # Gravitino integration (consumed by lcp.integrations.gravitino +
  # the meta-sync CronJob).  Empty URL deliberately disables the
  # feature -- in dev clusters without Gravitino, the CronJob exits 0
  # and the REST endpoint returns 503; both are intentional fallbacks.
  # Set this to the cluster-internal Gravitino endpoint when wiring
  # the real catalog (e.g. http://gravitino.gravitino.svc.cluster.local:8090).
  # Wired to the daft-platform Gravitino instance: probed via
  #   kubectl exec -n daft-platform gravitino -- curl localhost:8090/api/metalakes
  # which returns {"name":"daft_platform", catalogs:[..., lance, lance_multimodal]}.
  LCP_GRAVITINO_URL: "http://gravitino.daft-platform.svc.cluster.local:8090"
  LCP_GRAVITINO_METALAKE: "daft_platform"
  LCP_GRAVITINO_CATALOG: "lance"
  LCP_GRAVITINO_AUTH_TYPE: "none"
  LCP_GRAVITINO_REQUEST_TIMEOUT_SECONDS: "10"
---
# Secrets: MySQL password + MinIO credentials.  Created via stringData
# (k8s base64-encodes for us) -- this is dev cluster; for prod use
# external-secrets / sealed-secrets / vault.
apiVersion: v1
kind: Secret
metadata:
  name: lcp-secrets
  namespace: lcp
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
---
# PodDisruptionBudgets ensure at least one replica stays healthy during
# voluntary disruptions (node drain, cluster upgrade, rolling restart).
# minAvailable:1 works for both replicas=2 (allows 1 down) and any
# larger count.  Use maxUnavailable instead if you want a percentage-
# based policy once HPA is wired up.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lcp-server-pdb
  namespace: lcp
  labels:
    app.kubernetes.io/name: lcp-server
    app.kubernetes.io/part-of: lcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lcp-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lcp-worker-pdb
  namespace: lcp
  labels:
    app.kubernetes.io/name: lcp-worker
    app.kubernetes.io/part-of: lcp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lcp-worker
