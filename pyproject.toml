[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcp"
version = "0.1.0"
description = "LanceDB Control Plane - Server skeleton (REST + gRPC) for the Lance Lakehouse platform"
readme = "README-skeleton.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lance-Laker Team" }]

dependencies = [
    # Web framework (REST)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # gRPC framework
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",

    # ORM and DB
    "sqlalchemy>=2.0.25",
    "greenlet>=3.0.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",

    # Security
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",

    # Misc
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",

    # Observability (P1-7 Monitor v0).  prometheus_client is an
    # in-process metric registry + WSGI/ASGI exporter; we use it to
    # expose /metrics from the REST API and a standalone HTTP server
    # from long-running worker daemons (watcher).  Short-lived
    # CronJobs (planner / meta-sync) intentionally do not export
    # metrics yet -- they would need a Pushgateway, which is out of
    # scope for v0; their success/failure remains observable via
    # k8s job_status + structured logs.
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "grpcio-testing>=1.60.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
# Optional lance data-plane extras.  Install with `pip install .[lance]` when
# the worker process must talk to a real lance dataset (object storage or
# local fs).  Kept optional so unit/CI environments without native build
# toolchains can still resolve the base package.
lance = [
    "pylance>=0.20.0",
    "pyarrow>=15.0.0",
]
# Optional real-model embedding extras.  Install with
# `pip install .[embedding]` when the worker process must run a real
# sentence-transformers / Hugging Face model instead of the deterministic
# hash mock used in unit tests and slice-3 smoke runs.  Kept optional
# because torch + transformers add ~500 MB to the image and most CI / unit
# environments only need the mock path.
embedding = [
    # MiniLM-L6-v2 is the slice-4 default; sentence-transformers pulls
    # transformers + tokenizers + torch CPU automatically.  Pinning a
    # floor that matches the v2.x line keeps the Hugging Face hub API
    # contract stable.
    "sentence-transformers>=2.2.0",
    # numpy is a transitive dep of sentence-transformers, but list it
    # explicitly so a future version pin lives next to the model code
    # that consumes it (rather than buried in transformers).
    "numpy>=1.24.0",
]

[project.scripts]
lcp-server = "lcp.api.unified_server:run"
lcp-rest = "lcp.api.rest.main:run"
lcp-grpc = "lcp.api.grpc.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# E501  : line too long (handled by line-length=120 + noqa where needed)
# Note: ruff already prefers PEP 8's "break before operator" style, so we do
# not need to silence flake8's W503 here (and ruff would reject the unknown
# rule selector).
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: pure unit tests (mocked dependencies)",
    "api: REST/gRPC interface tests (in-process server)",
    "integration: end-to-end tests with external services",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/lcp"]
branch = true
omit = [
    "*/__init__.py",
    "*/api/grpc/services/*.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
