[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcp"
version = "0.1.0"
description = "LanceDB Control Plane - Server skeleton (REST + gRPC) for the Lance Lakehouse platform"
readme = "README-skeleton.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lance-Laker Team" }]

dependencies = [
    # Web framework (REST)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",

    # gRPC framework
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",

    # ORM and DB
    "sqlalchemy>=2.0.25",
    "greenlet>=3.0.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",

    # Security
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",

    # Misc
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "grpcio-testing>=1.60.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
# Optional lance data-plane extras.  Install with `pip install .[lance]` when
# the worker process must talk to a real lance dataset (object storage or
# local fs).  Kept optional so unit/CI environments without native build
# toolchains can still resolve the base package.
lance = [
    "pylance>=0.20.0",
    "pyarrow>=15.0.0",
]

[project.scripts]
lcp-rest = "lcp.api.rest.main:run"
lcp-grpc = "lcp.api.grpc.server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# E501  : line too long (handled by line-length=120 + noqa where needed)
# Note: ruff already prefers PEP 8's "break before operator" style, so we do
# not need to silence flake8's W503 here (and ruff would reject the unknown
# rule selector).
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "unit: pure unit tests (mocked dependencies)",
    "api: REST/gRPC interface tests (in-process server)",
    "integration: end-to-end tests with external services",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:jose.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:google.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src/lcp"]
branch = true
omit = [
    "*/__init__.py",
    "*/api/grpc/services/*.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
